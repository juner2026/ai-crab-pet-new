<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%}
#w{position:absolute;inset:0}
#w svg{width:100%!important;height:100%!important;display:block}</style></head><body><div id="w">
<!-- Smooth angel halo — a thin golden ellipse with a soft upper highlight. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 5" width="14" height="5">
  <ellipse cx="7" cy="2.5" rx="5.5" ry="1.55" fill="none" stroke="#ffd84d" stroke-width="0.8"/>
  <path d="M 2.5 1.62 C 4.45 0.72 9.55 0.72 11.5 1.62" fill="none" stroke="#fff3b0" stroke-width="0.3" stroke-linecap="round"/>
</svg>
</div><script>
(function(){
 var best=0;
 function fit(){
  var s=document.querySelector('#w>svg'); if(!s)return;
  var kids=s.children,minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9,ok=false;
  for(var i=0;i<kids.length;i++){
   var b; try{b=kids[i].getBBox();}catch(e){continue;}
   if(!b||!isFinite(b.width)||!isFinite(b.height))continue;
   if(b.width<=0&&b.height<=0)continue;
   ok=true;
   if(b.x<minX)minX=b.x;
   if(b.y<minY)minY=b.y;
   if(b.x+b.width>maxX)maxX=b.x+b.width;
   if(b.y+b.height>maxY)maxY=b.y+b.height;
  }
  if(!ok)return;
  var S=Math.max(maxX-minX,maxY-minY);
  if(!isFinite(S)||S<=best)return;
  best=S;
  var T=S*1.14;
  var cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  s.setAttribute('viewBox',(cx-T/2)+' '+(cy-T/2)+' '+T+' '+T);
 }
 setTimeout(fit,20); setTimeout(fit,240); setTimeout(fit,700);
})();
</script></body></html>
