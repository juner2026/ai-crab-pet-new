<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%}#w{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}#w svg,#w img{width:100%;height:100%;display:block}#w img{object-fit:contain}</style></head><body><div id="w"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 0 16 16">
  <rect id="ground-shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>
  
  <g id="master-group">
    <g id="body-color-group" fill="#DE886D">
      <rect id="torso" x="2" y="6" width="11" height="7"/>
      <rect id="left-arm" x="0" y="9" width="2" height="2"/>
      <rect id="right-arm" x="13" y="9" width="2" height="2"/>
      
      <rect id="outer-left-leg" x="3" y="13" width="1" height="2"/>
      <rect id="inner-left-leg" x="5" y="13" width="1" height="2"/>
      <rect id="inner-right-leg" x="9" y="13" width="1" height="2"/>
      <rect id="outer-right-leg" x="11" y="13" width="1" height="2"/>
    </g>
    
    <g id="eyes-color-group" fill="#000000">
      <rect id="left-eye" x="4" y="8" width="1" height="2"/>
      <rect id="right-eye" x="10" y="8" width="1" height="2"/>
    </g>
  </g>
</svg></div><script>
(function(){
 var best=0;
 function fit(){
  var s=document.querySelector('#w>svg'); if(!s)return;
  var kids=s.children,minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9,ok=false;
  for(var i=0;i<kids.length;i++){
   var b; try{b=kids[i].getBBox();}catch(e){continue;}
   if(!b||!isFinite(b.width)||!isFinite(b.height))continue;
   if(b.width<=0&&b.height<=0)continue;
   ok=true;
   if(b.x<minX)minX=b.x;
   if(b.y<minY)minY=b.y;
   if(b.x+b.width>maxX)maxX=b.x+b.width;
   if(b.y+b.height>maxY)maxY=b.y+b.height;
  }
  if(!ok)return;
  var S=Math.max(maxX-minX,maxY-minY);
  if(!isFinite(S)||S<=best)return;
  best=S;
  var T=S*1.30;
  var cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  s.setAttribute('viewBox',(cx-T/2)+' '+(cy-T/2)+' '+T+' '+T);
 }
 setTimeout(fit,20); setTimeout(fit,240); setTimeout(fit,700);
})();
</script></body></html>
