<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%}
#w{position:absolute;inset:0}
#w svg{width:100%!important;height:100%!important;display:block}</style></head><body><div id="w">
<!-- Wizard hat — pixel art (15x16 grid). Tall cone, brim, stars. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 15 16" shape-rendering="crispEdges" width="15" height="16">
  <g fill="#4b3da0">
    <rect x="7" y="0" width="1" height="1"/>
    <rect x="7" y="1" width="1" height="1"/>
    <rect x="6" y="2" width="3" height="1"/>
    <rect x="6" y="3" width="3" height="1"/>
    <rect x="6" y="4" width="3" height="1"/>
    <rect x="5" y="5" width="5" height="1"/>
    <rect x="5" y="6" width="5" height="1"/>
    <rect x="5" y="7" width="5" height="1"/>
    <rect x="4" y="8" width="7" height="1"/>
    <rect x="4" y="9" width="7" height="1"/>
    <rect x="4" y="10" width="7" height="1"/>
    <rect x="3" y="11" width="9" height="1"/>
    <rect x="3" y="12" width="9" height="1"/>
    <rect x="3" y="13" width="9" height="1"/>
  </g>
  <rect x="0" y="14" width="15" height="1" fill="#2f2566"/>
  <rect x="1" y="15" width="13" height="1" fill="#2f2566"/>
  <g fill="#ffd84d">
    <rect x="7" y="5" width="1" height="1"/>
    <rect x="6" y="9" width="1" height="1"/>
    <rect x="9" y="11" width="1" height="1"/>
  </g>
</svg>
</div><script>
(function(){
 var best=0;
 function fit(){
  var s=document.querySelector('#w>svg'); if(!s)return;
  var kids=s.children,minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9,ok=false;
  for(var i=0;i<kids.length;i++){
   var b; try{b=kids[i].getBBox();}catch(e){continue;}
   if(!b||!isFinite(b.width)||!isFinite(b.height))continue;
   if(b.width<=0&&b.height<=0)continue;
   ok=true;
   if(b.x<minX)minX=b.x;
   if(b.y<minY)minY=b.y;
   if(b.x+b.width>maxX)maxX=b.x+b.width;
   if(b.y+b.height>maxY)maxY=b.y+b.height;
  }
  if(!ok)return;
  var S=Math.max(maxX-minX,maxY-minY);
  if(!isFinite(S)||S<=best)return;
  best=S;
  var T=S*1.30;
  var cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  s.setAttribute('viewBox',(cx-T/2)+' '+(cy-T/2)+' '+T+' '+T);
 }
 setTimeout(fit,20); setTimeout(fit,240); setTimeout(fit,700);
})();
</script></body></html>
